---
name: chatwoot-stage

# STAGING Chatwoot — a database copy of production for testing the AI Gateway
# and the Electron client without touching production. Deployed on the same
# docker host (orangepi5). Differences from docker-pi-stacks/dev/chatwoot
# (production):
#   - all container names suffixed -stage (shared docker host with prod)
#   - volumes under ${VOLUME_DIR}/chatwoot-stage/*
#   - image pinned to the exact digest prod runs (no surprise migrations)
#   - env_file .env derived from prod: stage FRONTEND_URL/POSTGRES_HOST/REDIS_URL,
#     blank SMTP (no outbound email), blank inbound-email service
#   - router on chatwoot-stage.$FQDN (DNS + Cloudflare cert as other subdomains)
#
# IMPORTANT: the restored DB copy contains agent_bots.outgoing_url pointing at
# the PRODUCTION AI gateway. deploy-staging.sh patches it to the staging
# gateway BEFORE rails/sidekiq start. Never start rails/sidekiq on an
# unpatched copy.

services:
  base: &base
    image: chatwoot/chatwoot@sha256:3623f60b8fa1e773a41ee16d7523815922e8e45876f9777a2e5de3040c44f0ad
    env_file: .env
    volumes:
      - ${VOLUME_DIR}/chatwoot-stage/app:/app/storage
      - ./entrypoint/rails.sh:/app/docker/entrypoints/rails.sh:ro
    networks:
      - traefik

  db:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-stage-db
    restart: unless-stopped
    volumes:
      - ${VOLUME_DIR}/chatwoot-stage/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - traefik

  redis:
    image: redis:alpine
    container_name: chatwoot-stage-redis
    env_file: .env
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - ${VOLUME_DIR}/chatwoot-stage/redis:/data
    networks:
      - traefik

  rails:
    <<: *base
    container_name: chatwoot-stage-rails
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    volumes:
      - ${VOLUME_DIR}/chatwoot-stage/app:/app/storage
      - ./initializers/actioncable_boot.rb:/app/config/initializers/actioncable_boot.rb:ro
      - ./entrypoint/rails.sh:/app/docker/entrypoints/rails.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bundle exec ruby -r redis -e 'r = Redis.new(url: ENV[\"REDIS_URL\"] || \"redis://chatwoot-stage-redis:6379\", password: ENV[\"REDIS_PASSWORD\"]); exit 1 unless r.pubsub(\"channels\").include?(\"_action_cable_internal\")'"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.chatwoot-stage-rtr.entrypoints=websecure
      - traefik.http.routers.chatwoot-stage-rtr.rule=Host(`chatwoot-stage.$FQDN`)
      - traefik.http.routers.chatwoot-stage-rtr.tls=true
      - traefik.http.routers.chatwoot-stage-rtr.middlewares=chain-no-auth@file # No Authentication
      - traefik.http.routers.chatwoot-stage-rtr.service=chatwoot-stage-svc
      - traefik.http.services.chatwoot-stage-svc.loadbalancer.server.port=3000

  sidekiq:
    <<: *base
    container_name: chatwoot-stage-sidekiq
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    name: traefik
    external: true