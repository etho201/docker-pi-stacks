services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    volumes:
      - ${VOLUME_DIR}/backrest/data:/data
      - ${CONFIG_DIR}/backrest:/config
      - ${VOLUME_DIR}/backrest/cache:/cache
      - ${VOLUME_DIR}/backrest/tmp:/tmp
      - /root/.config/rclone:/root/.config/rclone # Mount for rclone config (needed when using rclone remotes)
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro # Required if actions need to use Docker
      - ${USER_GIT_DIRECTORY}:${USER_GIT_DIRECTORY}:ro # IMPORTANT: Mapped to local git directory for access to snapshot action scripts
      - /data/docker:/data/docker # IMPORTANT: Mapped to local folder
      - /mnt/backup-hdd/restic-repo:/mnt/backup-hdd/restic-repo # Mount local repos (optional for remote storage)
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ}
    # ports:
      # - "9898:9898"
    networks:
      - traefik
    restart: unless-stopped
    labels:
      # - autoheal=true
      - traefik.enable=true
      ## ==========================================================
      ## ROUTER 1: Public gRPC Sync Path (Remote Clients)
      ## ==========================================================
      - traefik.http.routers.backrest-sync.entrypoints=websecure
      - traefik.http.routers.backrest-sync.rule=Host(`backrest.$FQDN`) && PathPrefix(`/v1sync.BackrestSyncService/`)
      - traefik.http.routers.backrest-sync.tls=true
      - traefik.http.routers.backrest-sync.priority=100
      - traefik.http.routers.backrest-sync.service=backrest-sync-svc
      
      ## FIX: Apply your file-defined rate limit and secure headers here
      - traefik.http.routers.backrest-sync.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file

      ## Service 1: Forces h2c (HTTP/2 cleartext) to the upstream container
      - traefik.http.services.backrest-sync-svc.loadbalancer.server.port=9898
      - traefik.http.services.backrest-sync-svc.loadbalancer.server.scheme=h2c

      ## ==========================================================
      ## ROUTER 2: Private UI / Admin API
      ## ==========================================================
      - traefik.http.routers.backrest-ui.entrypoints=websecure
      - traefik.http.routers.backrest-ui.rule=Host(`backrest.$FQDN`)
      - traefik.http.routers.backrest-ui.tls=true
      - traefik.http.routers.backrest-ui.priority=10
      - traefik.http.routers.backrest-ui.middlewares=chain-oauth2-proxy@file
      - traefik.http.routers.backrest-ui.service=backrest-ui-svc

      ## Service 2: Standard HTTP for the web interface
      - traefik.http.services.backrest-ui-svc.loadbalancer.server.port=9898


networks:
  traefik:
    name: traefik
    external: true
    #run: docker network create traefik