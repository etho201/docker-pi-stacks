services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata-parent
    network_mode: host
    restart: unless-stopped
    # Orchestration: Wait for certbot to become completely healthy first
    depends_on:
      certbot:
        condition: service_healthy
    volumes:
      - ${CONFIG_DIR}/netdata:/etc/netdata
      - ${VOLUME_DIR}/netdata/lib:/var/lib/netdata
      - ${VOLUME_DIR}/netdata/cache:/var/cache/netdata
      # Share the certificates folder generated by Certbot
      - ${VOLUME_DIR}/netdata/letsencrypt:/etc/netdata/ssl:ro

  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: certbot-netdata
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -d "/etc/letsencrypt/live/netdata.${FQDN}" ]; then
          echo "=== Initializing Let's Encrypt Cert ==="
          certbot certonly --dns-cloudflare --dns-cloudflare-credentials /dev/null --non-interactive --agree-tos -m ${EMAIL} -d netdata.${FQDN}
        else
          echo "=== Cert already exists, skipping initial setup ==="
        fi

        trap exit TERM
        while :; do
          certbot renew
          sleep 12h & wait $$!
        done
    # Healthcheck: Pass once the fullchain certificate is successfully written to disk
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /etc/letsencrypt/live/netdata.${FQDN}/fullchain.pem"]
      interval: 5s
      timeout: 2s
      retries: 24 # 24 retries * 5s = Waits up to 2 minutes for Cloudflare DNS propagation
    volumes:
      - ${VOLUME_DIR}/netdata/letsencrypt:/etc/letsencrypt

