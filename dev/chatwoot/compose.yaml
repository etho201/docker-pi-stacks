---
name: chatwoot

services:
  base: &base
    image: chatwoot/chatwoot:latest-ce
    container_name: chatwoot-app
    env_file: .env
    volumes:
      - ${VOLUME_DIR}/chatwoot/app:/app/storage
    networks:
      - traefik
  rails:
    <<: *base
    container_name: chatwoot-rails
    depends_on:
      - chatwoot-db
      - chatwoot-redis
    # ports:
    #   - '127.0.0.1:3000:3000'
    networks:
      - traefik
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    volumes:
      - ${VOLUME_DIR}/chatwoot/app:/app/storage
      - ./initializers/actioncable_boot.rb:/app/config/initializers/actioncable_boot.rb:ro
    healthcheck:
      test: ["CMD-SHELL", "bundle exec ruby -r redis -e 'r = Redis.new(url: ENV[\"REDIS_URL\"] || \"redis://chatwoot-redis:6379\", password: ENV[\"REDIS_PASSWORD\"]); exit 1 unless r.pubsub(\"channels\").include?(\"_action_cable_internal\")'"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    restart: always
    labels:
      - autoheal=true
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.chatwoot-rtr.entrypoints=websecure
      - traefik.http.routers.chatwoot-rtr.rule=Host(`chatwoot.$FQDN`)
      - traefik.http.routers.chatwoot-rtr.tls=true
      ## Middlewares
      - traefik.http.routers.chatwoot-rtr.middlewares=chain-no-auth@file # No Authentication
      # - traefik.http.routers.chatwoot-rtr.middlewares=chain-basic-auth@file # Basic Authentication
      # - traefik.http.routers.chatwoot-rtr.middlewares=chain-oauth2-proxy@file # OAuth 2.0
      ## HTTP Services
      - traefik.http.routers.chatwoot-rtr.service=chatwoot-svc
      - traefik.http.services.chatwoot-svc.loadbalancer.server.port=3000

  sidekiq:
    <<: *base
    container_name: chatwoot-sidekiq
    depends_on:
      - chatwoot-db
      - chatwoot-redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - traefik
    restart: always

  chatwoot-db:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-db
    restart: always
    # ports:
    #   - '127.0.0.1:5432:5432'
    volumes:
      - ${VOLUME_DIR}/chatwoot/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Please provide your own password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - traefik

  chatwoot-redis:
    image: redis:alpine
    container_name: chatwoot-redis
    env_file: .env
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - ${VOLUME_DIR}/chatwoot/redis:/data
    # ports:
    #   - '127.0.0.1:6379:6379'
    networks:
      - traefik

  chatwoot-chat-widget:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: chatwoot-chat-widget
    user: root
    restart: unless-stopped
    volumes:
      - ./nginx/html:/tmp/templates/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - FQDN=${FQDN}
      - COMPANY_NAME=${COMPANY_NAME}
      - WEBSITE_TOKEN=${CHATWOOT_WEBSITE_TOKEN}
    entrypoint: >
      /bin/sh -c "
      mkdir -p /usr/share/nginx/html;
      envsubst '$$COMPANY_NAME $$FQDN $$WEBSITE_TOKEN' < /tmp/templates/html/chat.html.template > /usr/share/nginx/html/chat.html;
      exec nginx -g 'daemon off;'
      "
    # expose:
    #   - "8080"
    networks:
      - traefik
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.support-rtr.entrypoints=websecure
      - traefik.http.routers.support-rtr.rule=Host(`support.$FQDN`)
      - traefik.http.routers.support-rtr.tls=true
      ## Middlewares
      - traefik.http.routers.support-rtr.middlewares=chain-no-auth@file # No Authentication
      # - traefik.http.routers.support-rtr.middlewares=chain-basic-auth@file # Basic Authentication
      # - traefik.http.routers.support-rtr.middlewares=chain-oauth2-proxy@file # OAuth 2.0
      ## HTTP Services
      - traefik.http.routers.support-rtr.service=support-svc
      - traefik.http.services.support-svc.loadbalancer.server.port=8080


  gomodel:
    image: enterpilot/gomodel:latest
    container_name: gomodel
    # ports:
    #   - "4000:4000"                       # Chatwoot target API uplink port
    #   - "8080:8080"                       # (unused) dashboard port from older layout
    networks:
      - traefik
    environment:
      # 1. Base Server Config
      - PORT=4000
      - GOMODEL_MASTER_KEY=${GOMODEL_MASTER_KEY}   # Protects your proxy admin UI

      # 2. Ollama Cloud Mapping Config
      - OLLAMA_BASE_URL=https://ollama.com/v1                # Target destination (OpenAI-compatible /v1)
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}           # Your bearer auth credential
    configs:
      - source: gomodel_config
        target: /app/config.yaml
    restart: always
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.gomodel-rtr.entrypoints=websecure
      - traefik.http.routers.gomodel-rtr.rule=Host(`gomodel.$FQDN`)
      - traefik.http.routers.gomodel-rtr.tls=true
      ## Middlewares
      # - traefik.http.routers.gomodel-rtr.middlewares=chain-no-auth@file # No Authentication
      # - traefik.http.routers.gomodel-rtr.middlewares=chain-basic-auth@file # Basic Authentication
      - traefik.http.routers.gomodel-rtr.middlewares=gomodel-redirect@docker,chain-oauth2-proxy@file # OAuth 2.0 (root -> /admin/dashboard redirect)
      ## Redirect root to dashboard
      - traefik.http.middlewares.gomodel-redirect.redirectregex.regex=^https?://[^/]+/?$
      - traefik.http.middlewares.gomodel-redirect.redirectregex.replacement=https://gomodel.$FQDN/admin/dashboard
      - traefik.http.middlewares.gomodel-redirect.redirectregex.permanent=false
      ## HTTP Services
      - traefik.http.routers.gomodel-rtr.service=gomodel-svc
      - traefik.http.services.gomodel-svc.loadbalancer.server.port=4000

configs:
  gomodel_config:
    content: |
      server:
        port: 4000
      virtual_models:
        - source: "gpt-4.1-mini"
          target: "ollama/deepseek-v4-flash"

networks:
  traefik:
    name: traefik
    external: true
    #run: docker network create traefik