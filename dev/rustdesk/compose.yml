# RustDesk self-hosted rendezvous (hbbs) + relay (hbbr) server.
#
# Runs with HOST networking so hbbs sees each peer's real public IP:port.
# (Previously proxied through Traefik, which source-NATed the traffic and made
# NAT hole punching impossible — every session fell back to relay.)
#
# Router must forward to this host: 21115/tcp, 21116/tcp, 21116/udp,
# 21117/tcp, 21118/tcp, 21119/tcp.
#
# The relay address (-r) MUST point at something clients can reach directly.
# It is expressed as rustdesk.${FQDN}:21117, where FQDN is from the rustdesk
# project's .env. The full name must be a DNS-ONLY (grey-cloud) hostname that
# resolves straight to your public IP so raw TCP 21117 reaches the router.
# (A Cloudflare-proxied hostname would NOT work — Cloudflare only proxies
# 80/443.) Keep that DNS record pointing at your current WAN IP (ddclient does
# this).
#
# Clients must be configured with this server's PUBLIC KEY, i.e. the contents
# of ${VOLUME_DIR}/rustdesk/id_ed25519.pub.
---
name: rustdesk

services:
  rustdesk-id:
    container_name: rustdesk-id
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r rustdesk.${FQDN}:21117
    network_mode: host
    depends_on:
      - rustdesk-relay
    volumes:
      - ${VOLUME_DIR}/rustdesk:/root
    restart: unless-stopped
    # environment:
    #   - ALWAYS_USE_RELAY=Y  # force relay even when P2P is possible (NOT recommended)

  rustdesk-relay:
    container_name: rustdesk-relay
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    network_mode: host
    volumes:
      - ${VOLUME_DIR}/rustdesk:/root
    restart: unless-stopped
    environment:
      SINGLE_BANDWIDTH: 256 # max bandwidth for a single connection
      TOTAL_BANDWIDTH: 2048 # max bandwidth for all concurrent connections
      # Note: LIMIT_SPEED is a *hbbs* file-transfer setting, not a relay/hbbr
      # setting; move it to the hbbs service if you want it.
