services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:slim # options are: main, slim
    container_name: open-webui
    # ports:
    #   - "3000:8080"
    networks:
      - traefik
    volumes:
      - ${VOLUME_DIR}/open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # Pocket ID
      - ENABLE_OAUTH_SIGNUP=false
      - OAUTH_CLIENT_ID=${WEBUI_POCKETID_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${WEBUI_POCKETID_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME="Pocket ID"
      - OPENID_PROVIDER_URL=https://pocket-id.${FQDN}/.well-known/openid-configuration
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true

      # For group management, you can use the following variables:
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_CREATION=true
      # Make sure those match the ones you set up before in Pocket-ID
      - OAUTH_ALLOWED_ROLES="user, admin"
      - OAUTH_ADMIN_ROLES=admins
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_SCOPES="openid email profile groups"

      # Optional but useful variables:

      # So users are immediately added instead of being "pending"
      - DEFAULT_USER_ROLE=user
      # Make Pocket-ID the only auth method
      # comment out if you need access via password
      - ENABLE_LOGIN_FORM=false
      # Make Pocket-ID the source of truth for the profile pictures
      - OAUTH_UPDATE_PICTURE_ON_LOGIN=true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.open-webui-rtr.entrypoints=websecure"
      - "traefik.http.routers.open-webui-rtr.rule=Host(`open-webui.$FQDN`)"
      - "traefik.http.routers.open-webui-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.open-webui-rtr.middlewares=chain-no-auth@file" # No Authentication
      # - "traefik.http.routers.open-webui-rtr.middlewares=chain-basic-auth@file" # Basic Authentication
      # - "traefik.http.routers.open-webui-rtr.middlewares=chain-oauth2-proxy@file" # OAuth 2.0
      ## HTTP Services
      - "traefik.http.routers.open-webui-rtr.service=open-webui-svc"
      - "traefik.http.services.open-webui-svc.loadbalancer.server.port=8080"

  oikb:
    image: ghcr.io/open-webui/oikb:latest
    container_name: oikb
    environment:
      - OPEN_WEBUI_URL=http://open-webui:8080
      - OPEN_WEBUI_API_KEY=${WEBUI_API_KEY}
      - OIKB_API_KEY=${OIKB_API_KEY}
      - GITHUB_TOKEN=${OIKB_GITHUB_TOKEN}
      - LOG_FORMAT=json
    volumes:
      - ${CONFIG_DIR}/oikb/.oikb.yaml:/app/.oikb.yaml:ro
    command: daemon
    # ports:
    #   - "8080:8080"
    networks:
      - traefik
    depends_on:
      - open-webui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,httpx;sys.exit(0 if httpx.get('http://127.0.0.1:8080/health/ready',timeout=3).status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.oikb-rtr.entrypoints=websecure"
      - "traefik.http.routers.oikb-rtr.rule=Host(`oikb.$FQDN`)"
      - "traefik.http.routers.oikb-rtr.tls=true"
      ## Middlewares
      # - "traefik.http.routers.oikb-rtr.middlewares=chain-no-auth@file" # No Authentication
      # - "traefik.http.routers.oikb-rtr.middlewares=chain-basic-auth@file" # Basic Authentication
      - "traefik.http.routers.oikb-rtr.middlewares=chain-oauth2-proxy@file" # OAuth 2.0
      ## HTTP Services
      - "traefik.http.routers.oikb-rtr.service=oikb-svc"
      - "traefik.http.services.oikb-svc.loadbalancer.server.port=8080"

networks:
  traefik:
    name: traefik
