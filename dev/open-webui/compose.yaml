services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:slim # options are: main, slim
    container_name: open-webui
    # ports:
    #   - "3000:8080"
    networks:
      - traefik
    volumes:
      - ${VOLUME_DIR}/open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # Vector database: pgvector instead of the bundled ChromaDB
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${WEBUI_PGVECTOR_USER}:${WEBUI_PGVECTOR_PASSWORD}@open-webui-pgvector:5432/${WEBUI_PGVECTOR_DB}
      # Must match your embedding model's output size. Fixed once the table exists.
      - PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH=1536
      # halfvec halves the stored/indexed vector size; HNSW builds its index as data arrives
      - PGVECTOR_USE_HALFVEC=true
      - PGVECTOR_INDEX_METHOD=hnsw
      # Keep the connection pool small on a RAM-constrained host
      - PGVECTOR_POOL_SIZE=2
      - PGVECTOR_POOL_MAX_OVERFLOW=2

      # Pocket ID
      - OAUTH_CLIENT_ID=${WEBUI_POCKETID_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${WEBUI_POCKETID_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME="Pocket ID"
      - OPENID_PROVIDER_URL=https://pocket-id.${FQDN}/.well-known/openid-configuration
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true

      # For group management, you can use the following variables:
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_CREATION=true
      # Make sure those match the ones you set up before in Pocket-ID
      - OAUTH_ALLOWED_ROLES=user,admin
      - OAUTH_ADMIN_ROLES=admin
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_SCOPES=openid email profile

      # So users are immediately added instead of being "pending"
      - DEFAULT_USER_ROLE=user
      # Make Pocket-ID the only auth method
      # Auto redirect to Pocket-ID. If you need to login with password, navigate to /auth?form=true
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_AUTO_REDIRECT=true
      # Make Pocket-ID the source of truth for the profile pictures
      - OAUTH_UPDATE_PICTURE_ON_LOGIN=true
    depends_on:
      open-webui-pgvector:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.open-webui-rtr.entrypoints=websecure"
      - "traefik.http.routers.open-webui-rtr.rule=Host(`openwebui.$FQDN`)"
      - "traefik.http.routers.open-webui-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.open-webui-rtr.middlewares=chain-no-auth@file" # No Authentication
      # - "traefik.http.routers.open-webui-rtr.middlewares=chain-basic-auth@file" # Basic Authentication
      # - "traefik.http.routers.open-webui-rtr.middlewares=chain-oauth2-proxy@file" # OAuth 2.0
      ## HTTP Services
      - "traefik.http.routers.open-webui-rtr.service=open-webui-svc"
      - "traefik.http.services.open-webui-svc.loadbalancer.server.port=8080"

  # Postgres + pgvector for Open WebUI RAG embeddings.
  # Not published to Traefik; reachable only by other containers on the traefik network.
  open-webui-pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: open-webui-pgvector
    environment:
      - POSTGRES_DB=openwebui
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=${WEBUI_PGVECTOR_PASSWORD}
    # Small, explicit footprint for a shared 16GB host
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=30
    volumes:
      # PostgreSQL 18+ keeps the cluster in /var/lib/postgresql/<major>/docker
      - ${VOLUME_DIR}/open-webui-pgvector:/var/lib/postgresql
    # Must be at least maintenance_work_mem or parallel HNSW builds fail
    shm_size: 256mb
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  oikb:
    image: ghcr.io/open-webui/oikb:latest
    container_name: oikb
    environment:
      - OPEN_WEBUI_URL=http://open-webui:8080
      - OPEN_WEBUI_API_KEY=${WEBUI_API_KEY}
      - OIKB_API_KEY=${OIKB_API_KEY}
      - GITHUB_TOKEN=${OIKB_GITHUB_TOKEN}
      - LOG_FORMAT=json
    volumes:
      - ${CONFIG_DIR}/oikb/.oikb.yaml:/app/.oikb.yaml:ro
    command: daemon
    # ports:
    #   - "8080:8080"
    networks:
      - traefik
    depends_on:
      - open-webui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,httpx;sys.exit(0 if httpx.get('http://127.0.0.1:8080/health/ready',timeout=3).status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.oikb-rtr.entrypoints=websecure"
      - "traefik.http.routers.oikb-rtr.rule=Host(`oikb.$FQDN`)"
      - "traefik.http.routers.oikb-rtr.tls=true"
      ## Middlewares
      # - "traefik.http.routers.oikb-rtr.middlewares=chain-no-auth@file" # No Authentication
      # - "traefik.http.routers.oikb-rtr.middlewares=chain-basic-auth@file" # Basic Authentication
      - "traefik.http.routers.oikb-rtr.middlewares=chain-oauth2-proxy@file" # OAuth 2.0
      ## HTTP Services
      - "traefik.http.routers.oikb-rtr.service=oikb-svc"
      - "traefik.http.services.oikb-svc.loadbalancer.server.port=8080"

networks:
  traefik:
    name: traefik
